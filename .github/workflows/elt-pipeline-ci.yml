name: CI

on:
  push:
    paths:
      - "elt-pipeline/**"
  pull_request:
    paths:
      - "elt-pipeline/**"

defaults:
  run:
    working-directory: elt-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: elt-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v
